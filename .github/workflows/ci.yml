name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  napi:
    name: NAPI SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: zerodb-napi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Always build the native addon from source on this platform; the
      # checked-in target list is Windows-only, so pass an explicit target.
      - name: Build native addon
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          npx napi build --platform --release --target "$host_target"
      - run: npm test

  ts-to-ir:
    name: tools/ts-to-ir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: tools/ts-to-ir

  conformance:
    name: Conformance (required lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node conformance/ts/runner.mjs --lane required

  conformance-xfail:
    name: Conformance (expected-failure lane, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node conformance/ts/runner.mjs --lane xfail
