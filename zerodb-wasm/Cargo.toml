[package]
name = "zerodb-wasm"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimental browser wasm peer; durable IDB/OPFS adapters are JS (M4a-a)"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Default wasm-opt (-O) needs extra feature flags on current rustc wasm and
# -Oz has been worse for gzip than rustc LTO + opt-level=z. Size build is
# scripts/build.sh (CARGO_PROFILE_RELEASE_*). O4 still open; record gzip.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
zerodb-storage = { path = "../zerodb-storage", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json.workspace = true
hex.workspace = true
getrandom = { workspace = true, features = ["js"] }
