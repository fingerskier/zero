<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroDB peer</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 1rem; max-width: 700px; margin-inline: auto; }
  h1 { font-size: 1.2rem; }
  .pane { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 8px; padding: 0.8rem; }
  .meta { font-size: 0.72rem; opacity: 0.7; word-break: break-all; }
  .conn { font-size: 0.8rem; margin: 0.6rem 0; padding: 0.4rem 0.6rem; border-radius: 6px;
    background: color-mix(in srgb, currentColor 7%, transparent); }
  form { display: flex; gap: 0.4rem; margin: 0.5rem 0; flex-wrap: wrap; }
  input { flex: 1; min-width: 6rem; padding: 0.3rem; }
  button { padding: 0.3rem 0.7rem; cursor: pointer; }
  ul.nodes { list-style: none; padding: 0; }
  ul.nodes li { padding: 0.35rem 0.5rem; border-radius: 5px; margin-bottom: 0.3rem;
    background: color-mix(in srgb, currentColor 7%, transparent); }
  ul.nodes li.deleted { opacity: 0.45; text-decoration: line-through; }
  .props { font-size: 0.8rem; opacity: 0.85; }
  .nid { font-size: 0.65rem; opacity: 0.55; }
  .log { font-family: ui-monospace, monospace; font-size: 0.7rem; max-height: 10rem;
    overflow-y: auto; border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
    border-radius: 6px; padding: 0.5rem; margin-top: 1rem; }
  .log div { white-space: nowrap; }
</style>
</head>
<body>
<h1>ZeroDB peer — one store, auto-converging</h1>

<div class="conn" id="conn">connecting…</div>

<section class="pane" id="pane"><div class="meta"></div>
  <form data-act="create"><input name="label" placeholder="label (e.g. Todo)" required><button>create node</button></form>
  <form data-act="set"><input name="node" placeholder="node id" required><input name="key" placeholder="key" required><input name="value" placeholder="value" required><button>set</button></form>
  <ul class="nodes"></ul>
</section>

<div class="log" id="log"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel)
const log = (msg) => {
  const line = document.createElement('div')
  line.textContent = `${new Date().toLocaleTimeString()} ${msg}`
  $('#log').prepend(line)
}

async function api(path, body) {
  const res = await fetch(path, body
    ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : undefined)
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || res.statusText)
  return data
}

function connLine(s) {
  const peer = s.peerUrl ? `auto-sync → ${s.peerUrl}` : `serving ws://127.0.0.1:${s.wsPort} (no upstream peer)`
  let last = ''
  if (s.lastSync) {
    last = s.lastSync.kind === 'sync-error'
      ? ` · last: ✖ ${s.lastSync.error}`
      : ` · last: ${s.lastSync.role} accepted=${s.lastSync.accepted ?? 0} sent=${s.lastSync.sent ?? 0}`
  }
  $('#conn').textContent = peer + last
}

async function refresh() {
  const s = await api('/api/state')
  connLine(s)
  $('.meta').textContent = `peer ${s.peerId.slice(0, 16)}… · ds ${s.datastoreId.slice(0, 16)}… · ${s.ops} ops`
  const ul = $('.nodes')
  ul.innerHTML = ''
  for (const n of s.nodes) {
    const li = document.createElement('li')
    if (n.deleted) li.className = 'deleted'
    const props = Object.entries(n.props || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' · ')
    li.innerHTML = `<b>${n.label}</b> <span class="props">${props}</span>
      <div class="nid">${n.id} <button data-copy="${n.id}">copy id</button>
      <button data-del="${n.id}">delete</button></div>`
    ul.appendChild(li)
  }
}

const pane = $('#pane')
for (const form of pane.querySelectorAll('form')) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const fields = Object.fromEntries(new FormData(form))
    try {
      await api(`/api/${form.dataset.act}`, fields)
      form.reset()
    } catch (err) { log(`✖ ${err.message}`) }
  })
}
pane.addEventListener('click', async (e) => {
  if (e.target.dataset.copy) navigator.clipboard.writeText(e.target.dataset.copy)
  if (e.target.dataset.del) {
    try { await api('/api/delete', { node: e.target.dataset.del }) }
    catch (err) { log(`✖ ${err.message}`) }
  }
})

const es = new EventSource('/events')
es.onmessage = (e) => {
  const ev = JSON.parse(e.data)
  log(`${ev.kind}${ev.method ? ' ' + ev.method : ''}${ev.role ? ' ' + ev.role : ''}${ev.key ? ' ' + ev.key : ''}${ev.accepted !== undefined ? ` accepted=${ev.accepted} sent=${ev.sent ?? 0}` : ''}${ev.error ? ` ✖ ${ev.error}` : ''}`)
  refresh()
}

refresh()
setInterval(refresh, 2000)
</script>
</body>
</html>
