<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>zerodb browser peer (experimental M4a)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 6px; }
  input[type=text] { width: 14rem; }
  #log { font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; background: #f5f5f5;
         border: 1px solid #ddd; padding: 0.5rem; max-height: 14rem; overflow-y: auto; }
  li { font-family: monospace; font-size: 0.85rem; }
  .muted { color: #777; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>zerodb browser peer</h1>
<p class="muted">
  Experimental: local in-browser store (wasm) persisted to IndexedDB, syncing
  with a Node peer over WebSocket (sync protocol v2). The identity seed lives
  in IndexedDB — any script on this origin can sign as this peer.
</p>

<fieldset>
  <legend title="Who this browser store is: every operation it writes is Ed25519-signed by this identity">identity</legend>
  <div title="PeerId — BLAKE3 hash of this store's Ed25519 public key; identifies this device/author in every op">peer: <code id="peer">-</code></div>
  <div title="Datastore id — identity of the shared database. A fresh (empty) store adopts the peer's datastore id on first sync; two stores only sync if these match">datastore: <code id="ds">-</code></div>
  <div title="Number of operations in the local append-only oplog (the source of truth; visible state is derived from it)">ops: <code id="ops">0</code></div>
  <button id="reset" title="Delete the IndexedDB copy (identity seed + data) and mint a fresh identity — this store becomes a brand-new empty peer">reset local store</button>
</fieldset>

<fieldset>
  <legend title="Local writes — each one becomes a signed operation in the oplog, then syncs to peers">mutate</legend>
  <input type="text" id="label" placeholder="node label" value="Todo" title="Label for the new graph node (its type/tag, e.g. Todo)" />
  <button id="create" title="Create a new node in the local store (CreateNode operation)">create node</button>
  <div style="margin-top:0.5rem">
    <select id="nodeSel" title="Which existing node to set the property on"></select>
    <input type="text" id="propKey" placeholder="key" value="title" title="Property name to set on the node" />
    <input type="text" id="propVal" placeholder="value" title="Property value (string)" />
    <button id="setProp" title="Set the property as a last-writer-wins register — concurrent writes resolve by hybrid-logical-clock timestamp">set lww</button>
  </div>
  <ul id="nodes" title="Materialized view of the local store: nodes with their current property values"></ul>
</fieldset>

<fieldset>
  <legend title="Exchange operations with a Node peer over WebSocket (sync protocol v2, two-way)">sync</legend>
  <input type="text" id="url" value="ws://127.0.0.1:9787" title="WebSocket URL of the peer to sync with (e.g. the examples/webapp server's WS_PORT). Plaintext and unauthenticated — trusted/local use only" />
  <button id="syncOnce" title="One two-way session: send op ids, receive ops we lack, send ops the peer lacks — both sides converge">sync once</button>
  <button id="autoSync" title="Repeat 'sync once' on an interval (poll-based) so edits on either side keep converging">start auto-sync</button>
</fieldset>

<div id="log" title="Event log: local ops, sync sessions (accepted = ops received, sent = ops pushed), and errors"></div>

<script type="module">
// Local copy first (serving this directory), repo-root layout as fallback.
const wasmMod = await import('./pkg/zerodb_wasm.js')
  .catch(() => import('../../zerodb-wasm/pkg/zerodb_wasm.js'))
const init = wasmMod.default
const { ZeroDb } = wasmMod
import { syncOnce, autoSync } from './zero-sync.mjs'

const $ = id => document.getElementById(id)
const log = msg => {
  $('log').textContent += `${new Date().toISOString().slice(11, 19)} ${msg}\n`
  $('log').scrollTop = $('log').scrollHeight
}

// --- IndexedDB persistence -------------------------------------------------
// Incremental op-journal: 'state' holds { seed, ds }; 'journal' holds one
// wire op per key (op id). Each onChange event appends only the new ops
// instead of rewriting the whole bundle. A true OPFS/sqlite-wasm backend
// remains future work.
const DB_NAME = 'zerodb-browser-peer'
const idb = await new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, 2)
  req.onupgradeneeded = () => {
    if (!req.result.objectStoreNames.contains('state')) req.result.createObjectStore('state')
    if (!req.result.objectStoreNames.contains('journal')) req.result.createObjectStore('journal')
  }
  req.onsuccess = () => resolve(req.result)
  req.onerror = () => reject(req.error)
})
const idbReq = req => new Promise((resolve, reject) => {
  req.onsuccess = () => resolve(req.result)
  req.onerror = () => reject(req.error)
})
const idbGet = key => idbReq(idb.transaction('state').objectStore('state').get(key))
const idbSet = (key, value) =>
  idbReq(idb.transaction('state', 'readwrite').objectStore('state').put(value, key))
const journalAll = () => idbReq(idb.transaction('journal').objectStore('journal').getAll())
const journalPut = ops => new Promise((resolve, reject) => {
  const tx = idb.transaction('journal', 'readwrite')
  const store = tx.objectStore('journal')
  for (const op of ops) store.put(op, op.id)
  tx.oncomplete = () => resolve()
  tx.onerror = () => reject(tx.error)
})
const journalClear = () => idbReq(idb.transaction('journal', 'readwrite').objectStore('journal').clear())

await init()

let db
const persistedIds = new Set()
const saved = await idbGet('peer')
if (saved) {
  db = ZeroDb.fromSeed(saved.seed, saved.ds)
  let ops = await journalAll()
  if (ops.length === 0 && saved.bundle) {
    // Migrate the old whole-bundle format into the journal.
    ops = JSON.parse(saved.bundle).ops
  }
  if (ops.length > 0) {
    const res = db.importJson(JSON.stringify({
      format: 1,
      datastore_id: saved.ds,
      ops,
    }))
    if (res.accepted > 0) db.replay()
  }
  // Compact/rewrite if the journal drifted from the op set (skipped dupes,
  // old-format migration, interrupted writes).
  if (ops.length !== db.opCount()) {
    await journalClear()
    await journalPut(JSON.parse(db.exportJson()).ops)
  }
  for (const id of db.opIds()) persistedIds.add(id)
  await idbSet('peer', { seed: db.seedHex(), ds: db.datastoreId() })
  log(`restored identity + ${db.opCount()} ops from IndexedDB journal`)
} else {
  db = new ZeroDb()
  await idbSet('peer', { seed: db.seedHex(), ds: db.datastoreId() })
  log('fresh identity created')
}

// Append only the ops not yet journaled (identity meta re-written when the
// datastore id changes — first sync may adopt the peer's datastore).
async function persist() {
  const ids = db.opIds().filter(id => !persistedIds.has(id))
  if (ids.length > 0) {
    const ops = JSON.parse(db.exportOpsByIds(ids))
    await journalPut(ops)
    for (const op of ops) persistedIds.add(op.id)
  }
  const meta = await idbGet('peer')
  if (!meta || meta.ds !== db.datastoreId()) {
    await idbSet('peer', { seed: db.seedHex(), ds: db.datastoreId() })
  }
}

// Every successful mutation/import/replay persists incrementally (deferred:
// onChange fires while the wasm borrow is held).
db.onChange(() => queueMicrotask(async () => {
  try {
    await persist()
    render()
  } catch (e) {
    log(`persist error: ${e.message}`)
  }
}))

function render() {
  $('peer').textContent = db.peerId().slice(0, 16)
  $('ds').textContent = db.datastoreId().slice(0, 16)
  $('ops').textContent = db.opCount()
  const nodes = db.listNodes().filter(n => !n.deleted)
  $('nodes').innerHTML = ''
  $('nodeSel').innerHTML = ''
  for (const n of nodes) {
    const props = Object.entries(n.props || {})
      .map(([k, v]) => `${k}=${JSON.stringify(v)}`)
      .join(' · ')
    const li = document.createElement('li')
    li.textContent = `${n.label} ${n.id.slice(0, 8)}${props ? ` — ${props}` : ''}`
    li.title = 'Materialized property values for this node (derived from the oplog)'
    $('nodes').appendChild(li)
    const opt = document.createElement('option')
    opt.value = n.id
    opt.textContent = `${n.label} ${n.id.slice(0, 8)}`
    $('nodeSel').appendChild(opt)
  }
}
render()

async function mutated() {
  await persist()
  render()
}

$('create').onclick = async () => {
  const id = db.createNode($('label').value || 'Node')
  log(`created ${id.slice(0, 8)}`)
  await mutated()
}
$('setProp').onclick = async () => {
  const node = $('nodeSel').value
  if (!node) return log('no node selected')
  db.setLww(node, $('propKey').value, $('propVal').value)
  log(`set ${$('propKey').value} on ${node.slice(0, 8)}`)
  await mutated()
}
$('reset').onclick = async () => {
  await idbSet('peer', undefined)
  indexedDB.deleteDatabase(DB_NAME)
  location.reload()
}

$('syncOnce').onclick = async () => {
  try {
    const s = await syncOnce(db, $('url').value)
    log(`sync: accepted=${s.accepted} sent=${s.sent} remoteAccepted=${s.remoteAccepted}`)
    await mutated()
  } catch (e) {
    log(`sync error: ${e.message}`)
  }
}

let stopAuto = null
$('autoSync').onclick = () => {
  if (stopAuto) {
    stopAuto()
    stopAuto = null
    $('autoSync').textContent = 'start auto-sync'
    log('auto-sync stopped')
    return
  }
  stopAuto = autoSync(db, $('url').value, 2000, {
    onSync: async s => {
      if (s.accepted || s.sent) {
        log(`auto-sync: accepted=${s.accepted} sent=${s.sent}`)
        await mutated()
      }
    },
    onError: e => log(`auto-sync error: ${e.message}`),
  })
  $('autoSync').textContent = 'stop auto-sync'
  log('auto-sync started (push session preferred, 2s poll fallback)')
}
</script>
</body>
</html>
