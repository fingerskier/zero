[workspace]
resolver = "2"
members = [
    "zerodb-core",
    "zerodb-storage",
]

[workspace.package]
# Pre-M0 experimental crates: alpha semver, never published.
# The v0.1.0 product label belongs to the M3 release (SPEC §10), not these crates.
version = "0.1.0-alpha"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/fingerskier/zero"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
serde_json = "1"
ed25519-dalek = "2"
