[workspace]
resolver = "2"
members = [
    "zerodb-core",
    "zerodb-storage",
    "zerodb-cli",
    "zerodb-napi",
    "zerodb-wasm",
]

[workspace.package]
# Experimental crates: alpha semver, never published.
# MVP product label is M1 (`v0.1.0-local`); full multi-peer product is M3 (`v0.1.0`).
version = "0.1.0-alpha"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/fingerskier/zero"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
serde_json = "1"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"

