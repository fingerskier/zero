[workspace]
resolver = "2"
members = [
    "zerodb-core",
    "zerodb-storage",
    "zerodb-cli",
    "zerodb-napi",
    "zerodb-wasm",
    "zerodb-relay",
]

[workspace.package]
# Experimental crates: 0.1.0-alpha, never published.
# Git product labels: v0.1.0-local (M1), v0.1.0-sdk (M2).
# A future git tag v0.1.0 is a Decision Log act after M3c-a..d; it does not
# publish crates.io / npm or freeze formats by itself. Do not bump this field
# to 0.1.0 until that act. See CHANGELOG.md and doc/SUPPORT.md.
version = "0.1.0-alpha"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/fingerskier/zero"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
serde_json = "1"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"

